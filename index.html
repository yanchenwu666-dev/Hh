<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>乘法练习第一版</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    padding: 20px;

    font-family: Arial, sans-serif;

    background: linear-gradient(135deg, #dbeafe, #e9d5ff);

    min-height: 100vh;

    text-align: center;

}

.container {

    max-width: 500px;

    margin: auto;

    background: white;

    padding: 24px;

    border-radius: 25px;

    box-shadow: 0 8px 30px #00000015;

}

h1 {

    color: #6366f1;

    font-size: 28px;

}

.settings {

    display: flex;

    gap: 10px;

    margin-bottom: 15px;

}

select {

    width: 50%;

    padding: 12px;

    border: 2px solid #ddd;

    border-radius: 12px;

    font-size: 16px;

    background: white;

}

.stats {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 8px;

    margin: 20px 0;

}

.stat {

    background: #eef2ff;

    border-radius: 12px;

    padding: 12px 4px;

    color: #4338ca;

}

.stat strong {

    display: block;

    font-size: 25px;

    margin-top: 8px;

}

#question {

    font-size: 55px;

    font-weight: bold;

    margin: 25px 0;

    color: #222;

}

#answer {

    width: 100%;

    font-size: 36px;

    padding: 12px;

    text-align: center;

    border: 3px solid #818cf8;

    border-radius: 15px;

    outline: none;

}

.keyboard {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;

    margin-top: 15px;

}

button {

    border: none;

    border-radius: 12px;

    cursor: pointer;

    font-weight: bold;

    touch-action: manipulation;

}

.keyboard button {

    background: #eef2ff;

    color: #3730a3;

    font-size: 28px;

    padding: 15px;

}

.keyboard button:active {

    background: #c7d2fe;

}

.submit {

    width: 100%;

    background: #22c55e;

    color: white;

    font-size: 24px;

    padding: 15px;

    margin-top: 15px;

}

.secondary {

    width: 100%;

    background: #6366f1;

    color: white;

    font-size: 17px;

    padding: 13px;

    margin-top: 10px;

}

#feedback {

    min-height: 35px;

    font-size: 23px;

    font-weight: bold;

    margin-top: 15px;

}

.progress {

    height: 12px;

    background: #e5e7eb;

    border-radius: 20px;

    overflow: hidden;

}

#bar {

    width: 0%;

    height: 100%;

    background: #22c55e;

    transition: width 0.3s;

}

#counter {

    color: #666;

    margin: 10px;

}

#result {

    display: none;

    padding: 20px;

    background: #f0fdf4;

    border-radius: 15px;

    margin-top: 15px;

}

#result h2 {

    color: #16a34a;

}

</style>

</head>

<body>

<div class="container">

<h1>🌟 乘法练习第一版</h1>

<p>每天练一练，成为乘法小达人！</p>

<div class="settings">

<select id="difficulty" onchange="startGame()">

    <option value="easy">简单：1～5</option>

    <option value="medium">进阶：1～7</option>

    <option value="hard" selected>全部：1～10</option>

</select>

<select id="amount" onchange="startGame()">

    <option value="20">20道题</option>

    <option value="50">50道题</option>

    <option value="100" selected>100道题</option>

    <option value="200">200道题</option>

    <option value="500">500道题</option>

    <option value="0">无限练习</option>

</select>

</div>

<div class="stats">

    <div class="stat">

        答对

        <strong id="correct">0</strong>

    </div>

    <div class="stat">

        正确率

        <strong id="accuracy">0%</strong>

    </div>

    <div class="stat">

        连续答对

        <strong id="streak">0</strong>

    </div>

</div>

<div class="progress">

    <div id="bar"></div>

</div>

<p id="counter">第 1 题</p>

<div id="game">

<div id="question">2 × 3 = ?</div>

<input

    id="answer"

    type="text"

    inputmode="numeric"

    maxlength="3"

    autocomplete="off"

    placeholder="输入答案"

>

<div class="keyboard">

    <button onclick="addNumber('1')">1</button>

    <button onclick="addNumber('2')">2</button>

    <button onclick="addNumber('3')">3</button>

    <button onclick="addNumber('4')">4</button>

    <button onclick="addNumber('5')">5</button>

    <button onclick="addNumber('6')">6</button>

    <button onclick="addNumber('7')">7</button>

    <button onclick="addNumber('8')">8</button>

    <button onclick="addNumber('9')">9</button>

    <button onclick="clearAnswer()">清空</button>

    <button onclick="addNumber('0')">0</button>

    <button onclick="deleteNumber()">⌫</button>

</div>

<button class="submit" onclick="checkAnswer()">

    确认答案 ✓

</button>

<div id="feedback"></div>

</div>

<div id="result"></div>

<button class="secondary" onclick="startGame()">

    🔄 重新开始

</button>

<button class="secondary" onclick="practiceMistakes()">

    📚 错题练习

</button>

</div>

<script>

let a = 1;

let b = 1;

let correct = 0;

let total = 0;

let streak = 0;

let bestStreak = 0;

let limit = 100;

let mistakes = [];

let questions = [];

let reviewMode = false;

let locked = false;

let finished = false;

let nextTimer = null;

const answer = document.getElementById("answer");

const feedback = document.getElementById("feedback");

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];

    }

    return array;

}

function generateQuestions() {

    let difficulty =

        document.getElementById("difficulty").value;

    let max = 10;

    if (difficulty === "easy") max = 5;

    if (difficulty === "medium") max = 7;

    let list = [];

    for (let x = 1; x <= max; x++) {

        for (let y = 1; y <= max; y++) {

            list.push([x, y]);

        }

    }

    return shuffle(list);

}

function startGame() {

    clearTimeout(nextTimer);

    correct = 0;

    total = 0;

    streak = 0;

    bestStreak = 0;

    limit = Number(

        document.getElementById("amount").value

    );

    reviewMode = false;

    locked = false;

    finished = false;

    mistakes = [];

    questions = generateQuestions();

    document.getElementById("game").style.display = "block";

    document.getElementById("result").style.display = "none";

    feedback.textContent = "";

    updateStats();

    newQuestion();

}

function newQuestion() {

    if (limit > 0 && total >= limit) {

        finishGame();

        return;

    }

    if (questions.length === 0) {

        if (reviewMode) {

            finishGame();

            return;

        }

        questions = generateQuestions();

    }

    let question = questions.pop();

    a = question[0];

    b = question[1];

    document.getElementById("question").textContent =

        a + " × " + b + " = ?";

    document.getElementById("counter").textContent =

        limit === 0

        ? "第 " + (total + 1) + " 题"

        : "第 " + (total + 1) + " / " + limit + " 题";

    answer.value = "";

    feedback.textContent = "";

    locked = false;

}

function addNumber(number) {

    if (!locked && !finished && answer.value.length < 3) {

        answer.value += number;

    }

}

function clearAnswer() {

    if (!locked) answer.value = "";

}

function deleteNumber() {

    if (!locked) {

        answer.value = answer.value.slice(0, -1);

    }

}

function checkAnswer() {

    if (locked || finished) return;

    if (!/^\d+$/.test(answer.value.trim())) {

        feedback.textContent = "请先输入数字！";

        feedback.style.color = "#f59e0b";

        return;

    }

    locked = true;

    let userAnswer = Number(answer.value);

    let rightAnswer = a * b;

    total++;

    if (userAnswer === rightAnswer) {

        correct++;

        streak++;

        bestStreak = Math.max(bestStreak, streak);

        feedback.style.color = "#16a34a";

        if (streak % 10 === 0) {

            feedback.textContent =

                "🏆 太棒了！连续答对 " + streak + " 题！";

        } else {

            feedback.textContent = "🎉 答对啦！";

        }

        nextTimer = setTimeout(newQuestion, 700);

    } else {

        streak = 0;

        mistakes.push([a, b]);

        feedback.style.color = "#dc2626";

        feedback.textContent =

            "正确答案：" + a + " × " + b + " = " + rightAnswer;

        nextTimer = setTimeout(newQuestion, 2000);

    }

    updateStats();

}

function updateStats() {

    document.getElementById("correct").textContent = correct;

    document.getElementById("streak").textContent = streak;

    let accuracy = total === 0

        ? 0

        : Math.round(correct / total * 100);

    document.getElementById("accuracy").textContent =

        accuracy + "%";

    let progress = limit === 0

        ? 0

        : Math.min(100, total / limit * 100);

    document.getElementById("bar").style.width =

        progress + "%";

}

function finishGame() {

    finished = true;

    locked = true;

    document.getElementById("game").style.display = "none";

    document.getElementById("counter").textContent =

        "练习完成！";

    let accuracy = total === 0

        ? 0

        : Math.round(correct / total * 100);

    let result = document.getElementById("result");

    result.style.display = "block";

    result.innerHTML = `

        <h2>🏆 练习完成！</h2>

        <p>总题数：${total}</p>

        <p>答对：${correct} 题</p>

        <p>答错：${total - correct} 题</p>

        <p>正确率：${accuracy}%</p>

        <p>最高连续答对：${bestStreak} 题</p>

        <h3>继续加油！🌟</h3>

    `;

}

function practiceMistakes() {

    if (mistakes.length === 0) {

        alert("目前没有错题，继续加油！");

        return;

    }

    clearTimeout(nextTimer);

    questions = shuffle(mistakes.slice());

    mistakes = [];

    limit = questions.length;

    correct = 0;

    total = 0;

    streak = 0;

    bestStreak = 0;

    reviewMode = true;

    finished = false;

    locked = false;

    document.getElementById("game").style.display = "block";

    document.getElementById("result").style.display = "none";

    updateStats();

    newQuestion();

}

answer.addEventListener("input", function() {

    this.value = this.value.replace(/[^0-9]/g, "");

});

answer.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        checkAnswer();

    }

});

startGame();

</script>

</body>

</html>
<style>

#pointsBox {

    background: linear-gradient(135deg, #fff7cc, #fde68a);

    border: 2px solid #fbbf24;

    border-radius: 18px;

    padding: 15px;

    margin: 15px 0;

    color: #92400e;

    font-size: 20px;

    font-weight: bold;

}

#totalPoints {

    font-size: 36px;

    color: #d97706;

}

#bingoOverlay {

    position: fixed;

    inset: 0;

    z-index: 9999;

    background: rgba(255,255,255,0.88);

    display: none;

    align-items: center;

    justify-content: center;

    pointer-events: none;

}

#bingoContent {

    text-align: center;

}

#bingoCheck {

    width: 130px;

    height: 130px;

    margin: auto;

    border-radius: 50%;

    background: #22c55e;

    color: white;

    font-size: 95px;

    line-height: 130px;

    box-shadow: 0 0 40px #86efac;

}

#bingoTitle {

    font-size: 65px;

    font-weight: 900;

    color: #16a34a;

    margin-top: 15px;

}

#bingoPoints {

    font-size: 38px;

    font-weight: bold;

    color: #d97706;

}

.bingoAnimation {

    animation: bingoPop 0.7s ease both;

}

@keyframes bingoPop {

    0% {

        transform: scale(0.2);

        opacity: 0;

    }

    40% {

        transform: scale(1.15);

        opacity: 1;

    }

    70% {

        transform: scale(0.95);

    }

    100% {

        transform: scale(1);

        opacity: 1;

    }

}

.confettiPiece {

    position: fixed;

    left: 50%;

    top: 50%;

    width: 12px;

    height: 16px;

    border-radius: 3px;

    animation: confettiFly 0.7s ease-out forwards;

}

@keyframes confettiFly {

    from {

        transform: translate(0, 0) rotate(0deg);

        opacity: 1;

    }

    to {

        transform: translate(var(--x), var(--y))

                   rotate(720deg);

        opacity: 0;

    }

}

</style>

<div id="bingoOverlay">

    <div id="bingoContent">

        <div id="bingoCheck">✓</div>

        <div id="bingoTitle">BINGO!</div>

        <div id="bingoPoints">+1 积分</div>

    </div>

</div>

<script>

// 读取历史累计积分

let totalPoints = 0;

try {

    totalPoints = Number(

        localStorage.getItem("multiplicationPoints")

    ) || 0;

} catch (error) {

    totalPoints = 0;

}

// 创建积分显示区域

const pointsBox = document.createElement("div");

pointsBox.id = "pointsBox";

pointsBox.innerHTML = `

    🏆 累计积分

    <br>

    <span id="totalPoints">${totalPoints}</span>

`;

document.querySelector(".stats").before(pointsBox);

// 增加积分

function addPoint() {

    totalPoints++;

    document.getElementById(

        "totalPoints"

    ).textContent = totalPoints;

    try {

        localStorage.setItem(

            "multiplicationPoints",

            totalPoints

        );

    } catch (error) {

        console.log("积分暂时无法永久保存");

    }

}

// Bingo 动画

let bingoTimer;

function showBingo() {

    const overlay =

        document.getElementById("bingoOverlay");

    const content =

        document.getElementById("bingoContent");

    clearTimeout(bingoTimer);

    overlay.style.display = "flex";

    content.classList.remove("bingoAnimation");

    void content.offsetWidth;

    content.classList.add("bingoAnimation");

    const colors = [

        "#22c55e",

        "#facc15",

        "#6366f1",

        "#ec4899",

        "#38bdf8",

        "#f97316"

    ];

    // 生成彩色粒子

    for (let i = 0; i < 40; i++) {

        const piece = document.createElement("div");

        piece.className = "confettiPiece";

        piece.style.background =

            colors[Math.floor(

                Math.random() * colors.length

            )];

        const angle = Math.random() * Math.PI * 2;

        const distance = 80 + Math.random() * 180;

        piece.style.setProperty(

            "--x",

            Math.cos(angle) * distance + "px"

        );

        piece.style.setProperty(

            "--y",

            Math.sin(angle) * distance + "px"

        );

        overlay.appendChild(piece);

        setTimeout(() => piece.remove(), 700);

    }

    bingoTimer = setTimeout(() => {

        overlay.style.display = "none";

    }, 700);

}

// 保留原来的答题功能

const originalCheckAnswer = checkAnswer;

// 增加积分和动画

checkAnswer = function() {

    const previousCorrect = correct;

    originalCheckAnswer();

    if (correct > previousCorrect) {

        addPoint();

        showBingo();

    }

};

</script>
