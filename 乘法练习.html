<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乘法练习第一版</title><style>*{box-sizing:border-box}body{margin:0;background:#eff6ff;font-family:system-ui,sans-serif;color:#183153}main{max-width:620px;margin:auto;padding:20px}h1{text-align:center;color:#2563eb}section{background:white;border-radius:24px;padding:22px;margin:15px 0;box-shadow:0 5px 20px #24476b12}button,select,input{font:inherit;border-radius:14px;padding:12px;border:1px solid #cbd5e1}button{cursor:pointer;background:#2563eb;color:white;border:0;font-weight:bold}button:disabled{opacity:.4}label{display:block;margin:12px 0}select{width:100%;background:white}#question{text-align:center;font-size:clamp(38px,10vw,66px);font-weight:800;margin:24px 0}#answer{width:100%;text-align:center;font-size:36px}#feedback{text-align:center;min-height:48px;font-size:22px;font-weight:bold;padding:12px}.stats{display:flex;justify-content:space-around;text-align:center;gap:8px}.stats b{display:block;font-size:25px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.keys button{background:#e0edff;color:#173e82;font-size:25px}.wide{width:100%;margin-top:10px}.secondary{background:#e2e8f0;color:#183153}progress{width:100%;height:15px;accent-color:#22a06b}[hidden]{display:none!important}</style></head><body><main><h1>🌟 乘法练习第一版</h1><section id="setup"><label>练习难度<select id="level"><option value="5">简单：1～5 的乘法</option><option value="9">进阶：1～9 的乘法</option><option value="10" selected>全部：1～10 的乘法</option></select></label><label>练习题量<select id="count"><option>20</option><option>50</option><option>100</option><option value="0">无限练习</option></select></label><button class="wide" id="start">开始练习</button><button class="wide secondary" id="retry" disabled>错题重练</button></section><section id="play" hidden><div class="stats"><div>已答对<b id="correct">0</b></div><div>正确率<b id="rate">—</b></div><div>连续答对<b id="streak">0</b></div></div><p id="position"></p><progress id="progress" value="0" max="100"></progress><div id="question"></div><form id="form"><input id="answer" type="text" inputmode="numeric" pattern="[0-9]+" maxlength="3" autocomplete="off" placeholder="输入答案" aria-label="输入答案"><div class="keys" id="keys"></div><button class="wide" id="submit">确认答案</button></form><div id="feedback" aria-live="polite"></div><button id="next" class="wide" hidden>下一题</button><button id="stop" class="wide secondary">结束练习</button></section><section id="result" hidden><h2>🎉 练习完成！</h2><p id="summary"></p><div id="mistakes"></div><button class="wide" id="again">返回练习设置</button></section></main><script>
const $=id=>document.getElementById(id);let pool=[],queue=[],wrong=new Map(),q,total,done,correct,streak,locked,review=false;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function key(q){return q.join('×')}function begin(retry){review=retry;pool=retry?[...wrong.values()]:[];if(!retry){let n=+$('level').value;for(let a=1;a<=n;a++)for(let b=1;b<=n;b++)pool.push([a,b]);}if(!pool.length)return;total=retry?pool.length:+$('count').value;queue=[];done=correct=streak=0;$('setup').hidden=$('result').hidden=true;$('play').hidden=false;stats();next()}function stats(){$('correct').textContent=correct;$('rate').textContent=done?Math.round(correct/done*100)+'%':'—';$('streak').textContent=streak;$('progress').hidden=!total;$('progress').value=total?done/total*100:0}function next(){if(total&&done>=total){finish();return}if(!queue.length)queue=shuffle([...pool]);q=queue.pop();locked=false;$('position').textContent='第 '+(done+1)+' 题'+(total?' / '+total:'');$('question').textContent=q[0]+' × '+q[1]+' = ?';$('answer').value='';$('answer').readOnly=false;$('feedback').textContent='';$('submit').disabled=false;$('next').hidden=true}function check(e){e.preventDefault();if(locked)return;let s=$('answer').value.trim();if(!/^\d{1,3}$/.test(s)){$('feedback').textContent='请先输入数字';return}locked=true;done++;let v=q[0]*q[1];if(+s===v){correct++;streak++;wrong.delete(key(q));$('feedback').textContent='✓ 答对啦！';$('feedback').style.color='#15803d'}else{streak=0;wrong.set(key(q),q);$('feedback').textContent='正确答案是 '+v+'，继续加油！';$('feedback').style.color='#b91c1c'}$('answer').readOnly=true;$('submit').disabled=true;$('next').hidden=false;$('next').textContent=total&&done>=total?'查看成绩':'下一题';stats()}function finish(){$('play').hidden=true;$('result').hidden=false;$('summary').textContent=`完成 ${done} 题，答对 ${correct} 题，正确率 ${done?Math.round(correct/done*100):0}%。`;$('mistakes').textContent=wrong.size?'待复习错题：'+[...wrong.values()].map(q=>key(q)+'='+q[0]*q[1]).join('、'):'没有待复习错题！';$('retry').disabled=!wrong.size;$('retry').textContent='错题重练（'+wrong.size+'题）'}$('start').onclick=()=>begin(false);$('retry').onclick=()=>begin(true);$('form').onsubmit=check;$('next').onclick=next;$('stop').onclick=finish;$('again').onclick=()=>{$('result').hidden=true;$('setup').hidden=false};for(let k of ['1','2','3','4','5','6','7','8','9','清空','0','⌫']){let b=document.createElement('button');b.type='button';b.textContent=k;b.onclick=()=>{if(locked)return;let a=$('answer');a.value=k==='清空'?'':k==='⌫'?a.value.slice(0,-1):(a.value+k).slice(0,3)};$('keys').append(b)}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('play').hidden&&locked&&e.target!==$('next')){e.preventDefault();next()}});
</script></body></html>
